<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi médicaments V1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f5f7fa;margin:0;color:#17202a}.app{max-width:560px;margin:auto;padding:18px 16px 40px}h1{font-size:28px}.date{color:#667085;margin-bottom:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:700;font-size:17px}.meta,.small{color:#667085;font-size:14px;margin-top:5px}.status{margin-top:8px;font-size:14px}.taken{color:#167c4b}.pending{color:#b26a00}button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;font-size:15px;background:#e8eef5}.primary{background:#1463ff;color:white;width:100%;padding:14px;margin-top:8px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1}.active{background:#17202a;color:white}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;margin:6px 0 12px;font-size:16px;box-sizing:border-box}.hidden{display:none}.stat{font-size:32px;font-weight:800}</style></head><body><div class="app"><h1>💊 Mes médicaments</h1><div id="today" class="date"></div><div class="tabs"><button class="tab active" onclick="show('todayView',this)">Aujourd'hui</button><button class="tab" onclick="show('historyView',this)">Historique</button><button class="tab" onclick="show('statsView',this)">Statistiques</button></div><section id="todayView"><div id="list"></div><button class="primary" onclick="openForm()">＋ Ajouter un médicament</button></section><section id="historyView" class="hidden"><div class="card"><b>Historique</b><div id="history"></div></div></section><section id="statsView" class="hidden"><div class="card"><div class="small">Doses confirmées</div><div class="stat" id="rate">—</div><div class="small">sur les prises enregistrées</div></div></section><section id="formView" class="hidden"><div class="card"><h2 id="formTitle">Ajouter un médicament</h2><label>Nom</label><input id="name" placeholder="Ex. Médicament A"><label>Dose</label><input id="dose" placeholder="Ex. 1 comprimé"><label>Heure</label><input id="time" type="time" value="08:00"><button class="primary" onclick="saveMed()">Enregistrer</button><button style="width:100%;margin-top:8px" onclick="show('todayView',document.querySelector('.tab'))">Annuler</button></div></section></div><script>const K='medTrackerV1';let d=JSON.parse(localStorage.getItem(K)||'null')||{meds:[{id:1,name:'Médicament A',dose:'1 comprimé',time:'08:00'},{id:2,name:'Médicament B',dose:'20 mg',time:'20:00'}],logs:[]};let edit=null;const key=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(K,JSON.stringify(d))}document.getElementById('today').textContent=new Intl.DateTimeFormat('fr-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());function show(id,b){['todayView','historyView','statsView','formView'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function openForm(id=null){edit=id;document.getElementById('formTitle').textContent=id?'Modifier le médicament':'Ajouter un médicament';let m=d.meds.find(x=>x.id===id);name.value=m?.name||'';dose.value=m?.dose||'';time.value=m?.time||'08:00';show('formView')}function saveMed(){let n=name.value.trim(),q=dose.value.trim(),t=time.value;if(!n||!q||!t)return alert('Veuillez remplir les trois champs.');if(edit)Object.assign(d.meds.find(x=>x.id===edit),{name:n,dose:q,time:t});else d.meds.push({id:Date.now(),name:n,dose:q,time:t});save();show('todayView',document.querySelector('.tab'))}function log(m){return d.logs.find(x=>x.date===key()&&x.medId===m.id)}function take(id){let l=log(d.meds.find(x=>x.id===id));if(l)l.takenAt=null;else d.logs.push({date:key(),medId:id,takenAt:new Date().toISOString()});save();render()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let list=document.getElementById('list');list.innerHTML='';d.meds.slice().sort((a,b)=>a.time.localeCompare(b.time)).forEach(m=>{let l=log(m),ok=l?.takenAt,c=document.createElement('div');c.className='card';c.innerHTML=`<div class="row"><div><div class="name">${esc(m.name)}</div><div class="meta">${esc(m.dose)} · ${m.time}</div><div class="status ${ok?'taken':'pending'}">${ok?'✓ Pris à '+new Date(ok).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}):'⏰ À prendre'}</div></div><button onclick="take(${m.id})">${ok?'Annuler':'Pris'}</button></div><div style="margin-top:10px"><button onclick="openForm(${m.id})">Modifier</button></div>`;list.appendChild(c)});let h=document.getElementById('history');h.innerHTML='';d.logs.slice().reverse().forEach(l=>{let m=d.meds.find(x=>x.id===l.medId);if(m)h.innerHTML+=`<div class="meta" style="padding:8px 0"><b>${esc(m.name)}</b> — ${l.date} — ${l.takenAt?'pris '+new Date(l.takenAt).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}):'annulé'}</div>`});let total=d.logs.length,t=d.logs.filter(x=>x.takenAt).length;document.getElementById('rate').textContent=total?Math.round(t/total*100)+'%':'—'}render();</script></body></html>
